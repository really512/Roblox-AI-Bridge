name: Read Roblox Instances

on:
  workflow_dispatch:
    inputs:
      universe_id:
        description: "Roblox Universe ID"
        required: true
        type: string
      place_id:
        description: "Roblox Start Place ID"
        required: true
        type: string

jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Read Roblox top-level instances
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ inputs.universe_id }}
          PLACE_ID: ${{ inputs.place_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ROBLOX_API_KEY:-}" ]; then
            echo "ROBLOX_API_KEY secret is missing."
            exit 1
          fi

          LIST_URL="https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}/places/${PLACE_ID}/instances/root:listChildren"

          echo "Requesting Roblox instance list..."

          RESPONSE=$(curl --fail-with-body -sS \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Accept: application/json" \
            "${LIST_URL}")

          OPERATION_PATH=$(echo "$RESPONSE" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["path"])')

          echo "Operation received."

          for i in $(seq 1 12); do
            sleep 5

            OPERATION=$(curl --fail-with-body -sS \
              -H "x-api-key: ${ROBLOX_API_KEY}" \
              -H "Accept: application/json" \
              "https://apis.roblox.com/cloud/v2/${OPERATION_PATH}")

            DONE=$(echo "$OPERATION" | python3 -c \
              'import json,sys; print(str(json.load(sys.stdin).get("done", False)).lower())')

            if [ "$DONE" = "true" ]; then
              echo "Roblox operation completed."
              break
            fi

            echo "Still waiting... ($i/12)"
          done

          python3 - "$OPERATION" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])

          if not data.get("done"):
              print("Operation did not finish in time.")
              raise SystemExit(1)

          response = data.get("response", {})
          instances = response.get("instances", [])

          print("")
          print("=== Roblox top-level instances ===")

          for item in instances:
              engine = item.get("engineInstance", {})
              name = engine.get("Name", "<unnamed>")
              instance_id = engine.get("Id", "<no id>")
              has_children = engine.get("hasChildren", item.get("hasChildren", False))

              print(f"- {name} | ID: {instance_id} | Has children: {has_children}")

          print("")
          print(f"Total: {len(instances)}")
          PY          echo "Calling Roblox Open Cloud..."
          RESPONSE=$(curl --fail-with-body -sS \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Accept: application/json" \
            "${URL}")

          echo "Roblox Open Cloud accepted the request."
          echo "${RESPONSE}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Operation path received:", d.get("path", "<missing>"))'
